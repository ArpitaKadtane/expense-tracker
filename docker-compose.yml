services:
  db:
    image: postgres:16-alpine
    container_name: expense-db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/expense_tracker
      DB_USER: expense
      DB_PASSWORD: expense
      PORT: 8080
      # Local development secret only — override with a strong value in production.
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-me-0123456789}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
