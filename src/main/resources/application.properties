spring.application.name=expense-tracker

# Server port (Render sets the PORT env var)
server.port=${PORT:8080}

# PostgreSQL datasource — override via environment variables in deployment.
# Defaults target the local docker-compose Postgres service.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USER:expense}
spring.datasource.password=${DB_PASSWORD:expense}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS — comma-separated list of allowed frontend origins.
# Defaults to "*" for local development; set CORS_ALLOWED_ORIGINS
# (e.g. https://your-app.vercel.app) in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# JWT — the signing secret must be at least 32 characters (256 bits).
# ALWAYS override JWT_SECRET with a strong random value in production.
app.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
